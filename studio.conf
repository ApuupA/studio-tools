# ------------------------------------------------------------
#  Studio Tools – default settings (tracked in git)
#
#  Do NOT edit this file for your own studio. Put your values into
#  studio.local.conf next to it (same VARIABLE="value" lines) –
#  "studio init" creates that file, git ignores it, updates don't touch it.
# ------------------------------------------------------------

# Your Studio folder. Set by "studio init" in studio.local.conf.
# Empty = the tools sit inside the Studio folder (<Studio>/99_SYSTEM/Scripts).
STUDIO_ROOT=""

# The backup drive (name as it shows up in Finder). Holds:
#   Studio_Mirror/    1:1 copy of the Studio folder (updated at the end of each session)
#   Studio_Archive/   archived, finished projects, by year (folder name: ARCHIVE_FOLDER)
ARCHIVE_VOLUME="/Volumes/Studio_Backup"

# Folder on the backup drive for archived projects: <drive>/<ARCHIVE_FOLDER>/<year>/<project>
ARCHIVE_FOLDER="Studio_Archive"

# Safety guard: if a backup would delete more files than this from the mirror,
# the script stops and asks first (protects against accidental mass deletion).
MAX_DELETE_FILES=200

# Apps that must be closed before backing up.
DAW_APPS="Pro Tools|Cubase"

# Minimum free space on the SSD before starting (GB).
MIN_FREE_GB=50

# Session templates (folder names inside 03_LIBRARY/Templates/ProTools and .../Cubase).
# Each template is a normal, empty session/project folder. new_project.sh / add_songs.sh
# copy it into every empty song folder and rename the session file.
# Override per project with --pt NAME / --cb NAME. Missing template = folder stays empty.
PT_TEMPLATE="TEMPLATE_48k"
CB_TEMPLATE="TEMPLATE_48k"

# Which DAW gets song folders + sessions in FULL production projects: pt | cb | both
# (other types: write = cb, rec/mix/master = pt). Override per call with --daw pt|cb|both.
FILL_DAW="pt"

# --- Start / End Session -------------------------------------------------------
# macOS Shortcuts that switch your Focus mode on/off.
# Create them once in the Shortcuts app with the action "Set Focus".
# Not found = skipped.
FOCUS_ON_SHORTCUT="Studio Focus On"
FOCUS_OFF_SHORTCUT="Studio Focus Off"

# Apps quit at session start (process names, separated by |).
# Browsers are left open on purpose (references, YouTube …) – add "Safari|Google Chrome" if you like.
QUIT_APPS="Mail|Messages|Slack|MSTeams|Microsoft Outlook|WhatsApp|Discord|Spotify|Music|Photos"

# Keep the Mac awake during a session (stops at End_Session or after this many hours).
KEEP_AWAKE_HOURS=14

# Warnings at session start
MIN_FREE_INTERNAL_GB=100     # free space on the Mac's internal drive
BACKUP_WARN_DAYS=7           # last End_Session backup older than this

# --- Archive -------------------------------------------------------------------
# When a project is archived, copies of these folders stay on the Mac in
# 03_LIBRARY/Portfolio/<project>/ for listening and referencing.
ARCHIVE_KEEP_FOLDERS="03_Mixes 03_Demos 05_Masters 05_Songs"
# yes = only the newest version per song (incl. its variants like _Instr), no = everything
ARCHIVE_KEEP_LATEST_ONLY="yes"

# --- MP3 / delivery ------------------------------------------------------------
MP3_BITRATE=320                # kbit/s for client previews and delivery packages
# Folders that hold bounces (used by studio mp3 / deliver / approve)
BOUNCE_FOLDERS="03_Mixes 03_Demos 05_Masters 05_Songs"

# --- Library inventory (studio plugins) ----------------------------------------
# Extra folders that hold sample libraries, separated by |  – e.g. on another drive:
#   LIBRARY_FOLDERS="/Volumes/Samples/Toontrack|/Users/Shared/Audio_Libraries"
# Each subfolder of these counts as one library. The usual places (Toontrack, Steinberg,
# Native Instruments, IK Multimedia, Spectrasonics, XLN, Arturia, /Users/Shared …) are checked anyway.
LIBRARY_FOLDERS=""
# Only folders of at least this size are listed (MB)
LIBRARY_MIN_MB=100
